# Structured audit log: no query string, headers, user agent, or referrer.
# $cf_ip is only a claim; the collector trusts it only for Cloudflare peer CIDRs.
log_format beszel_security escape=json '{"time":"$msec","request_id":"$request_id","peer":"$remote_addr","cf_ip":"$http_cf_connecting_ip","host":"$host","method":"$request_method","path":"$uri","status":"$status"}';
access_log /var/log/nginx/beszel-security.log beszel_security;
